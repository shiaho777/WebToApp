<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="880" height="336" fill="#fff" rx="12"/><text x="440" y="40" font-size="20" fill="#0F172A" font-weight="700" text-anchor="middle" >Community without sign-up</text><text x="440" y="62" font-size="12" fill="#475569" font-weight="400" text-anchor="middle" >a device fingerprint becomes a persistent public identity</text><rect x="40" y="92" width="210" height="86" rx="12" fill="#FBE9DD" stroke="#C97953" stroke-width="1.2"/><text x="145" y="120" font-size="13.5" fill="#0F172A" font-weight="700" text-anchor="middle" >Device fingerprint</text><text x="145" y="144" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" >no account, no password</text><rect x="290" y="92" width="210" height="86" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/><text x="395" y="120" font-size="13.5" fill="#0F172A" font-weight="700" text-anchor="middle" >User #N</text><text x="395" y="144" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" >sequential public ID</text><text x="395" y="161" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle" >name · bio · avatar</text><path d="M 250 135 H 282" stroke="#94A3B8" stroke-width="2"/><polygon points="282,130 282,140 292,135" fill="#94A3B8"/><rect x="560" y="92" width="280" height="186" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/><text x="576" y="120" font-size="13.5" fill="#0F172A" font-weight="700" text-anchor="start" >What your #N unlocks</text><circle cx="584" cy="146" r="3.2" fill="#059669"/><text x="596" y="150" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" >Creator card on every app you publish</text><circle cx="584" cy="172" r="3.2" fill="#059669"/><text x="596" y="176" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" >Public profile at ?u=N — shareable</text><circle cx="584" cy="198" r="3.2" fill="#059669"/><text x="596" y="202" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" >Comments + 1–5 star ratings</text><circle cx="584" cy="224" r="3.2" fill="#059669"/><text x="596" y="228" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" >Apps listed on your profile page</text><circle cx="584" cy="250" r="3.2" fill="#059669"/><text x="596" y="254" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start" >Delete = author or site admin</text><path d="M 500 135 H 540" stroke="#94A3B8" stroke-width="2"/><polygon points="540,130 540,140 550,135" fill="#94A3B8"/><text x="440" y="312" font-size="11" fill="#475569" font-weight="400" text-anchor="middle" >identities persist across sessions; deleting your history entry removes the app, its comments and its market listing</text></svg>